name: Sync wiltodelta/remove-ai-watermarks
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add wiltodelta/remove-ai-watermarks
        run: git remote add wiltodelta/remove-ai-watermarks https://github.com/wiltodelta/remove-ai-watermarks.git || true
      - name: Fetch wiltodelta/remove-ai-watermarks
        run: git fetch wiltodelta/remove-ai-watermarks
      - name: Merge wiltodelta/remove-ai-watermarks (ours strategy)
        run: |
          git merge wiltodelta/remove-ai-watermarks/HEAD --no-edit -X ours || git merge FETCH_HEAD --no-edit -X ours || true
          git diff --name-only --diff-filter=U | while IFS= read -r f; do
            case "$f" in
              .github/workflows/sync-wiltodelta/remove-ai-watermarks.yml) ;;
              .github/workflows/*) git rm -f "$f" ;;
              *) git checkout --ours -- "$f" || true ;;
            esac
          done
      - name: Keep only our workflow
        run: |
          mkdir -p .github/workflows
          find .github/workflows -type f ! -name "sync-wiltodelta/remove-ai-watermarks.yml" -delete
      - name: Commit and push
        run: |
          git add -f .github/workflows
          git commit -m "chore: preserve fork sync workflow" --allow-empty
          git push