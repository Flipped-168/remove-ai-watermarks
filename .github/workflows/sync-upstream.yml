name: Sync upstream
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add upstream
        run: git remote add upstream https://github.com/wiltodelta/remove-ai-watermarks.git || true
      - name: Fetch upstream
        run: git fetch upstream
      - name: Save our workflow
        run: cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml.bak
      - name: Merge upstream
        run: git merge upstream/HEAD --no-edit || git merge FETCH_HEAD --no-edit
      - name: Restore only our workflow file
        run: |
          mkdir -p .github/workflows
          find .github/workflows -type f -delete
          cp /tmp/sync-upstream.yml.bak .github/workflows/sync-upstream.yml
          git add .github/workflows
          git commit -m "chore: preserve fork sync workflow" --allow-empty
      - name: Push
        run: git push